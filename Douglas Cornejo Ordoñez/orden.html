<!DOCTYPE html>
<html lang="en">

<head>

    <script src="orden.js"></script>

</head>

<body onload="mostrarPersona()">

        <div class="ingreseDatos">
            <h3>Ingrese su nombre:</h3>
            <input type="text" id="txtTexto">

            <h3>Ingrese su edad:</h3>
            <input type="text" id="txtEdad">
            <div id="lblErrorEdad"></div>
        </div>
        <div id="lblMayor">

        </div>
        <div id="lblMenor">

        </div>
        <div id="containerButton">
            <div>
                <input type="button" value="ENCONTRAR MENOR" class="button" onclick="determinarMenor()">
            </div>
            <div>
                <input type="button" value="GUARDAR" class="button" onclick="agregarPersona()">
            </div>
            <div>
                <input type="button" value="ENCONTRAR MAYOR" class="button" onclick="determinarMayor()">
            </div>
        </div>
        

        <div id="tablaPersonas">

        </div>
    </div>
</body>

</html>
